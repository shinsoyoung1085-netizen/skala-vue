<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 Mockup</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background: #f5f7fa;
    padding: 24px;
    color: #222;
  }
  h1 { margin-bottom: 16px; }
  .status-bar {
    background: #333;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    min-height: 20px;
  }
  .search-box { margin-bottom: 20px; }
  .search-box input {
    padding: 8px 12px;
    width: 280px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1em;
  }
  .search-result { margin-top: 8px; color: #555; }
  .card-list { display: flex; gap: 16px; flex-wrap: wrap; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    width: 200px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform .15s;
  }
  .card:hover { transform: translateY(-4px); }
  .city-name { font-size: 1.2em; font-weight: bold; margin-bottom: 6px; }
  .temp { font-size: 1.6em; margin-bottom: 6px; }
  .status { color: #666; margin-bottom: 8px; }
  .label-hot { color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
  .label-cool { color: #3498db; font-weight: bold; margin-bottom: 10px; }
  .detail-btn {
    padding: 6px 10px;
    border: none;
    background: #2c7be5;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  .detail-btn:hover { background: #1a5bb8; }
  .empty { color: #888; }
  [v-cloak] { display: none; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <h1>🌤️ 지역별 날씨 현황</h1>

  <!-- 4. 이벤트 및 수식어: 카드 클릭 시 상태바 표시 -->
  <div class="status-bar">{{ statusMessage || '카드를 클릭해 도시를 선택해보세요.' }}</div>

  <!-- 3. 양방향 바인딩 및 한글 처리: :value / @input -->
  <div class="search-box">
    <input
      type="text"
      placeholder="도시 이름을 한글로 검색하세요"
      :value="searchText"
      @input="onSearchInput"
    />
    <div class="search-result" v-if="searchText">입력한 도시명: {{ searchText }}</div>
  </div>

  <!-- 1. 배열 렌더링: v-for + :key -->
  <div class="card-list">
    <div
      class="card"
      v-for="city in filteredList"
      :key="city.id"
      @click="selectCity(city.name)"
    >
      <div class="city-name">{{ city.name }}</div>
      <div class="temp">{{ city.temp }}°C</div>
      <div class="status">{{ city.status }}</div>

      <!-- 2. 조건부 렌더링: v-if / v-else -->
      <div v-if="city.temp >= 25" class="label-hot">🔥 더움 (25도 이상)</div>
      <div v-else class="label-cool">❄️ 선선함 (25도 미만)</div>

      <!-- 4. 버블링 방지: @click.stop -->
      <button class="detail-btn" @click.stop="showDetail(city.name, city.status)">상세보기</button>
    </div>
    <div v-if="filteredList.length === 0" class="empty">검색 결과가 없습니다.</div>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;

createApp({
  setup() {
    const weatherList = ref([
      { id: 'city_01', name: '서울', temp: 28, status: '맑음' },
      { id: 'city_02', name: '수원', temp: 24, status: '비' },
      { id: 'city_03', name: '부산', temp: 26, status: '구름' },
    ]);

    const searchText = ref('');
    const statusMessage = ref('');

    const onSearchInput = (e) => {
      searchText.value = e.target.value;
    };

    const filteredList = computed(() => {
      if (!searchText.value) return weatherList.value;
      return weatherList.value.filter(city => city.name.includes(searchText.value));
    });

    const selectCity = (name) => {
      statusMessage.value = `${name}이 선택되었습니다.`;
    };

    const showDetail = (cityName, status) => {
      window.alert(`${cityName}의 현재 날씨는 [${status}] 상태입니다.`);
    };

    return {
      weatherList,
      searchText,
      statusMessage,
      filteredList,
      onSearchInput,
      selectCity,
      showDetail,
    };
  }
}).mount('#app');
</script>
</body>
</html>
